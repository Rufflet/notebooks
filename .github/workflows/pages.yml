name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          cat > .observable/dist/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Notebooks · Rufflet</title>
          <meta http-equiv="refresh" content="0; url=./torture-test/">
          <a href="./torture-test/">Markdown → PDF torture test</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .observable/dist
      - id: deployment
        uses: actions/deploy-pages@v4
