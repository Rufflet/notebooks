    # Markdown → PDF torture test

    ## 20 cases that break converters

    Markdown looks simple until you try to print it. Wide tables get clipped, code runs off the page, Chinese turns into empty boxes, Mermaid prints as source code, and `> [!NOTE]` shows up as literal text.

    I build [md2file](https://md2file.com/?utm_source=${utmSource}&utm_medium=notebook&utm_campaign=torture-test), a Markdown → PDF converter, and collected these cases while fixing my own exporter. Each case is a small, reproducible `.md` file with a note on what usually goes wrong and what a correct PDF should look like. Download them all as one file below and run them through whatever tool you use.
  </script>

m/a/very/long/path/that/keeps/going/and/going/without/any/natural/break/points/index.html?query=parameter&another=value&utm_source=test\n\nMarkdown link with long visible URL: [https://example.com/documentation/getting-started/installation/linux/ubuntu/24.04/troubleshooting](https://example.com/)\n\nGerman compound: Donaudampfschifffahrtselektrizitätenhauptbetriebswerkbauunterbeamtengesellschaft.\n\nChemistry: Methionylthreonylthreonylglutaminylarginyltyrosylglutamylserylleucylphenylalanylalanylglutaminylleucyllysylglutamylarginyllysine.\n\nIn a table:\n\n| Key | Value |\n|---|---|\n| token | eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIn0 |\n","11-math.md":"\u003c!-- What we test: inline $...$ and block $$...$$ math (KaTeX/MathJax syntax), aligned environments and matrices. A dollar sign used as currency must stay text. -->\n\n# 11 · Math\n\nInline: the area of a circle is $A = \\pi r^2$, and Euler's identity is $e^{i\\pi} + 1 = 0$.\n\nBlock:\n\n$$\n\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}\n$$\n\nAligned:\n\n$$\n\\begin{aligned}\nf(x) &= (x+1)^2 \\\\\n     &= x^2 + 2x + 1\n\\end{aligned}\n$$\n\nMatrix:\n\n$$\nA = \\begin{pmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{pmatrix}\n$$\n\nCurrency, not math: the plan costs $5 per month and $50 per year.\n","12-mermaid.md":"\u003c!-- What we test: Mermaid code blocks must become diagrams (vector, not blurry), not be printed as source code. Large diagrams must fit the page width. -->\n\n# 12 · Mermaid diagrams\n\n```mermaid\nflowchart LR\n  A[Markdown] --> B{Parser}\n  B -->|HTML| C[Browser]\n  B -->|PDF| D[Print engine]\n  D --> E((File))\n```\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant S as Server\n  U->>S: Upload .md\n  S-->>U: 202 Accepted\n  S->>S: Render\n  S-->>U: PDF ready\n```\n\n```mermaid\ngantt\n  dateFormat YYYY-MM-DD\n  title Release plan\n  section Build\n  Parser    :a1, 2026-01-05, 10d\n  Renderer  :after a1, 14d\n  section Ship\n  Beta      :2026-02-01, 7d\n```\n","13-footnotes.md":"\u003c!-- What we test: footnote references become superscript links and footnote text is collected at the end (or bottom of page) with working back-links. -->\n\n# 13 · Footnotes\n\nMarkdown footnotes are an extension[^ext], supported by GitHub, pandoc and many others[^many].\n\nA footnote can be referenced twice[^ext] and can contain **formatting** and code[^code].\n\n[^ext]: Not part of CommonMark.\n[^many]: But each tool renders them a little differently.\n[^code]: For example `markdown-it-footnote`:\n    ```js\n    md.use(footnote)\n    ```\n","14-github-alerts.md":"\u003c!-- What we test: GitHub alert syntax (> [!NOTE] etc.) should render as colored callouts with a title, not as a blockquote with the literal text \"[!NOTE]\". -->\n\n# 14 · GitHub alerts\n\n> [!NOTE]\n> Useful information that users should know.\n\n> [!TIP]\n> Helpful advice for doing things better.\n\n> [!IMPORTANT]\n> Key information users need to know.\n\n> [!WARNING]\n> Urgent info that needs immediate attention.\n\n> [!CAUTION]\n> Advises about risks or negative outcomes.\n\n> A regular blockquote, for comparison.\n","15-details.md":"\u003c!-- What we test: \u003cdetails>/\u003csummary> are interactive in HTML. A static PDF should show the content expanded; a collapsed block hides content from the reader. -->\n\n# 15 · Collapsible details\n\n\u003cdetails>\n\u003csummary>Click to expand: installation steps\u003c/summary>\n\n1. Download the package.\n2. Run `npm install`.\n3. Start the app.\n\n\u003c/details>\n\n\u003cdetails open>\n\u003csummary>Already open: FAQ\u003c/summary>\n\n**Q:** Should this be visible in the PDF?\n**A:** Yes, in both blocks.\n\n\u003c/details>\n","16-inline-html.md":"\u003c!-- What we test: inline HTML elements (\u003ckbd>, \u003csup>, \u003csub>, \u003cmark>, \u003cbr>), raw HTML blocks and column alignment in tables. -->\n\n# 16 · Inline HTML and table alignment\n\nPress \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>Shift\u003c/kbd> + \u003ckbd>P\u003c/kbd>. Water is H\u003csub>2\u003c/sub>O, and E = mc\u003csup>2\u003c/sup>. This is \u003cmark>highlighted\u003c/mark>.\u003cbr>This line follows a hard `\u003cbr>`.\n\n\u003cp align=\"center\">\u003cstrong>Centered HTML paragraph\u003c/strong>\u003c/p>\n\n| Left | Center | Right |\n|:-----|:------:|------:|\n| a | b | 1.00 |\n| longer text | centered | 1,234.50 |\n\n\u003ctable>\n  \u003ctr>\u003cth>Raw\u003c/th>\u003cth>HTML\u003c/th>\u003c/tr>\n  \u003ctr>\u003ctd colspan=\"2\">A cell spanning two columns\u003c/td>\u003c/tr>\n\u003c/table>\n","17-syntax-highlighting.md":"\u003c!-- What we test: syntax highlighting for common and less common languages; colors must survive printing (background colors are often dropped). Unknown languages should fall back to plain monospace. -->\n\n# 17 · Syntax highlighting\n\n```typescript\ninterface User { id: number; name: string }\nconst greet = (u: User): string => `Hello, ${u.name}`;\n```\n\n```rust\nfn main() {\n    let v: Vec\u003ci32> = (1..=5).map(|x| x * x).collect();\n    println!(\"{:?}\", v);\n}\n```\n\n```haskell\nquicksort :: Ord a => [a] -> [a]\nquicksort []     = []\nquicksort (p:xs) = quicksort [x | x \u003c- xs, x \u003c p] ++ [p] ++ quicksort [x | x \u003c- xs, x >= p]\n```\n\n```elixir\ndefmodule Greeter do\n  def hello(name), do: \"Hello, #{name}!\"\nend\n```\n\n```diff\n- const color = \"red\";\n+ const color = \"green\";\n```\n\n```not-a-real-language\nThis block uses an unknown language tag and must still render as code.\n```\n","18-yaml-frontmatter.md":"---\ntitle: \"Front matter test\"\nauthor: Test Author\ndate: 2026-01-01\ntags: [markdown, pdf]\n---\n\n\u003c!-- What we test: the YAML front matter above must not be printed as text (or as a horizontal rule followed by a \"title:\" paragraph). Tools may use it for metadata. -->\n\n# 18 · YAML front matter\n\nIf you see `title: \"Front matter test\"` printed above this heading, the converter does not understand front matter.\n\n---\n\nThe line above is a real horizontal rule and must stay one.\n","19-anchors-toc.md":"\u003c!-- What we test: links to headings (#anchors) must be clickable inside the PDF and jump to the right page; non-ASCII headings and duplicate headings need stable ids. -->\n\n# 19 · Anchors and table of contents\n\n## Contents\n\n- [Introduction](#introduction)\n- [Details with spaces](#details-with-spaces)\n- [Ünïcödé heading](#ünïcödé-heading)\n- [Repeated heading (first)](#repeated)\n- [Repeated heading (second)](#repeated-1)\n- [Back to top](#19--anchors-and-table-of-contents)\n\n## Introduction\n\nSome text. Jump to [the details](#details-with-spaces).\n\n## Details with spaces\n\nMore text.\n\n## Ünïcödé heading\n\nGitHub keeps non-ASCII letters in ids; other tools transliterate them.\n\n## Repeated\n\nFirst.\n\n## Repeated\n\nSecond. GitHub gives it the id `repeated-1`.\n","20-very-long-document.md":"\u003c!-- What we test: a 100+ page document. Watch export time, memory, and whether page numbers and the last pages are intact. This file is one section; the notebook's \"Download 150-page version\" button repeats it 60 times. -->\n\n# 20 · Very long document — section {n}\n\n## Overview {n}\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit. Integer posuere erat a ante venenatis dapibus posuere velit aliquet. Maecenas faucibus mollis interdum. Cras mattis consectetur purus sit amet fermentum.\n\n| Metric | Value |\n|---|--:|\n| Section | {n} |\n| Rows | 3 |\n\n```js\nconsole.log(\"section {n}\");\n```\n\n- Point one\n- Point two\n- Point three\n\nDonec ullamcorper nulla non metus auctor fringilla. Nullam id dolor id nibh ultricies vehicula ut id elit. Vestibulum id ligula porta felis euismod semper. Curabitur blandit tempus porttitor.\n"};

  <script id="4" type="module" hidden="">
    import MarkdownIt from "npm:markdown-it@15.0.2";
    import anchor from "npm:markdown-it-anchor@9.2.0";
    import footnote from "npm:markdown-it-footnote@4.0.0";
    import taskLists from "npm:markdown-it-task-lists@2.1.1";
    import alerts from "npm:markdown-it-github-alerts@1.0.1";
    import texmath from "npm:markdown-it-texmath@1.0.0";
    import katex from "npm:katex@0.19.0";
    import hljs from "npm:highlight.js@11.12.0";

    for (const href of [
      "https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css",
      "https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.css"
    ]) {
      if (!document.querySelector(`link[href="${href}"]`)) {
        document.head.append(Object.assign(document.createElement("link"), {rel: "stylesheet", href}));
      }
    }

    // GitHub-style heading ids: lowercase, drop punctuation, spaces → "-", "-1" suffix for duplicates.
    function githubSlugger() {
      const seen = new Map();
      return (s) => {
        const base = s.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
        const count = seen.get(base) ?? 0;
        seen.set(base, count + 1);
        return count ? `${base}-${count}` : base;
      };
    }

    function renderMarkdown(source) {
      const mi = MarkdownIt({
        html: true,
        linkify: true,
        highlight: (code, lang) => lang && hljs.getLanguage(lang) ? hljs.highlight(code, {language: lang}).value : ""
      });
      mi.use(anchor, {slugify: githubSlugger()})
        .use(footnote)
        .use(taskLists, {enabled: false})
        .use(alerts)
        .use(texmath, {engine: katex, delimiters: "dollars"});

      // Front matter: show it as metadata, never as body text.
      let frontMatter = null;
      const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n/.exec(source);
      if (m) frontMatter = m[1], source = source.slice(m[0].length);

      const root = document.createElement("div");
      root.className = "tt-render";
      root.innerHTML = mi.render(source);
      if (frontMatter) {
        const meta = html`<details class="tt-frontmatter"><summary>Front matter (metadata, not printed)</summary><pre>${frontMatter}</pre></details>`;
        root.prepend(meta);
      }
      for (const img of root.querySelectorAll("img")) {
        const svg = caseImages[img.getAttribute("src")];
        if (svg) img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }
      for (const a of root.querySelectorAll("a[href^='#']")) {
        a.addEventListener("click", (event) => {
          const target = root.querySelector(`[id="${CSS.escape(decodeURIComponent(a.hash.slice(1)))}"]`);
          if (target) event.preventDefault(), target.scrollIntoView({behavior: "smooth", block: "start"});
        });
      }
      return root;
    }

    // Mermaid is loaded lazily, only for cases that contain diagrams.
    async function renderMermaid(root) {
      for (const code of root.querySelectorAll("pre > code.language-mermaid")) {
        try {
          code.parentElement.replaceWith(await mermaid({raw: [code.textContent]}));
        } catch (error) {
          code.parentElement.before(html`<p class="tt-error">Mermaid error: ${error.message}</p>`);
        }
      }
      return root;
    }
  </script>

        const url = URL.createObjectURL(new Blob([text], {type: "text/markdown;charset=utf-8"}));

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      return button;
